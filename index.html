    // ==========================================
    // 6. REPORTS VIEW (SRS 4.1 Page 7)
    // ==========================================
    function ReportsView({ projects, units, clients, expenses, budgetCategories }) {
      const [reportType, setReportType] = useState('financial'); // 'financial', 'progress', 'sales'

      const totalRevenue = units
        .filter(u => u.status === 'Booked' || u.status === 'Sold')
        .reduce((sum, u) => sum + u.price, 0);

      const totalBudget = projects.reduce((sum, p) => sum + p.budget, 0);
      const totalExpenses = expenses.reduce((sum, e) => sum + e.amount, 0);

      const exportCSV = () => {
        let csvContent = "data:text/csv;charset=utf-8,";
        if (reportType === 'financial') {
          csvContent += "Category,Allocated Amount,Spent Amount,Utilization\n";
          budgetCategories.forEach(b => {
            csvContent += `"${b.name}",${b.allocated},${b.spent},${Math.round((b.spent/b.allocated)*100)}%\n`;
          });
        } else if (reportType === 'sales') {
          csvContent += "Unit No,Project,Type,Price,Status\n";
          units.forEach(u => {
            csvContent += `"${u.unitNo}","${u.projectName}","${u.bhk || u.type}",${u.price},"${u.status}"\n`;
          });
        } else {
          csvContent += "Project,Type,Location,Progress,Budget\n";
          projects.forEach(p => {
            csvContent += `"${p.name}","${p.type}","${p.location}",${p.progress}%,${p.budget}\n`;
          });
        }
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `BuildPro_${reportType}_report.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      return (
        <div className="space-y-6 max-w-7xl mx-auto">
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <h2 className="text-2xl font-extrabold text-slate-900 tracking-tight">Executive Reports & Analytics</h2>
              <p className="text-xs font-medium text-slate-500 mt-0.5">Generate financial statements, sales conversions, and engineering progress audits</p>
            </div>
            
            <div className="flex items-center gap-3">
              <button
                onClick={exportCSV}
                className="px-4 py-2 bg-white hover:bg-slate-50 text-slate-700 font-bold text-xs rounded-xl border border-slate-200 shadow-xs flex items-center gap-2"
              >
                <span>Export CSV</span>
              </button>
              <button
                onClick={() => window.print()}
                className="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs rounded-xl shadow-md shadow-blue-500/25 flex items-center gap-2"
              >
                <span>Print / PDF</span>
              </button>
            </div>
          </div>

          {/* Report Type Selector */}
          <div className="flex items-center gap-2 border-b border-slate-200 pb-2">
            {[
              { id: 'financial', label: 'Financial & Budget Report' },
              { id: 'sales', label: 'Sales & Inventory Report' },
              { id: 'progress', label: 'Construction Progress Report' }
            ].map(r => (
              <button
                key={r.id}
                onClick={() => setReportType(r.id)}
                className={`px-4 py-2 rounded-xl text-xs font-bold transition-all ${
                  reportType === r.id ? 'bg-blue-600 text-white shadow-sm' : 'text-slate-600 hover:bg-white'
                }`}
              >
                {r.label}
              </button>
            ))}
          </div>

          {/* FINANCIAL REPORT */}
          {reportType === 'financial' && (
            <div className="space-y-6">
              <div className="grid grid-cols-1 sm:grid-cols-3 gap-5">
                <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-xs">
                  <p className="text-xs font-bold text-slate-400 uppercase">Total Portfolio Budget</p>
                  <p className="text-2xl font-extrabold text-slate-900 mt-1">${(totalBudget / 1000000).toFixed(2)}M</p>
                </div>
                <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-xs">

                <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-xs">
                  <p className="text-xs font-bold text-slate-400 uppercase">Realized Revenue</p>
                  <p className="text-2xl font-extrabold text-emerald-600 mt-1">${(totalRevenue / 1000).toLocaleString()}k</p>

                {projects.map(p => (

                      <h4 className="text-sm font-bold text-slate-900">{p.name}</h4>
                      <p className="text-xs text-slate-500">{p.location} • {p.startDate} to {p.endDate}</p>

                    <div className="flex items-center gap-4">

                      </div>
                      <span className="font-bold text-xs text-slate-800">{p.progress}%</span>

    // ==========================================
    // 10. MODALS: NEW PROJECT, BOOKING, GALLERY
    // ==========================================
    function NewProjectModal({ onClose, onSubmit }) {
      const [formData, setFormData] = useState({
        name: '',
        location: '',
        type: 'Residential',
        description: '',
        budget: '5000000',
        unitsCount: '40',
        startDate: '2026-11-20',
        endDate: '2027-12-31'
      });

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!formData.name || !formData.location) return;
        onSubmit(formData);
      };

      return (
        <div className="fixed inset-0 bg-slate-950/60 backdrop-blur-xs flex items-center justify-center p-4 z-50 animate-fadeIn">
          <div className="bg-white rounded-3xl max-w-lg w-full p-6 shadow-2xl border border-slate-200 space-y-4">
            <div className="flex items-center justify-between pb-3 border-b border-slate-100">
              <h3 className="font-extrabold text-lg text-slate-900">+ Create New Project</h3>
              <button onClick={onClose} className="text-slate-400 hover:text-slate-600 font-bold text-lg">×</button>
            </div>

            <form onSubmit={handleSubmit} className="space-y-4 text-xs">
              <div>
                <label className="font-bold text-slate-700 block mb-1">Project Name *</label>
                <input
                  type="text"
                  required
                  placeholder="e.g. Royal Palms Residency"
                  value={formData.name}
                  onChange={(e) => setFormData({ ...formData, name: e.target.value })}
                  className="w-full border border-slate-200 rounded-xl p-2.5 focus:border-blue-500 focus:outline-none"
                />
              </div>

              <div className="grid grid-cols-2 gap-4">
                <div>
                  <label className="font-bold text-slate-700 block mb-1">Location *</label>
                  <input
                    type="text"
                    required
                    placeholder="e.g. Coimbatore"
                    value={formData.location}
                    onChange={(e) => setFormData({ ...formData, location: e.target.value })}
                    className="w-full border border-slate-200 rounded-xl p-2.5 focus:border-blue-500 focus:outline-none"
                  />
                </div>
                <div>
                  <label className="font-bold text-slate-700 block mb-1">Project Type</label>
                  <select
                    value={formData.type}
                    onChange={(e) => setFormData({ ...formData, type: e.target.value })}
                    className="w-full border border-slate-200 rounded-xl p-2.5 focus:border-blue-500 focus:outline-none"
                  >
                    <option value="Residential">Residential</option>
                    <option value="Commercial">Commercial</option>
                    <option value="Plotted Layout">Plotted Layout</option>
                  </select>
                </div>
              </div>

              <div className="grid grid-cols-2 gap-4">
                <div>
                  <label className="font-bold text-slate-700 block mb-1">Budget ($)</label>
                  <input
                    type="number"
                    value={formData.budget}
                    onChange={(e) => setFormData({ ...formData, budget: e.target.value })}
                    className="w-full border border-slate-200 rounded-xl p-2.5 focus:border-blue-500 focus:outline-none"
                  />
                </div>
                <div>
                  <label className="font-bold text-slate-700 block mb-1">Total Planned Units</label>
                  <input
                    type="number"
                    value={formData.unitsCount}
                    onChange={(e) => setFormData({ ...formData, unitsCount: e.target.value })}
                    className="w-full border border-slate-200 rounded-xl p-2.5 focus:border-blue-500 focus:outline-none"
                  />
                </div>
              </div>

              <div>
                <label className="font-bold text-slate-700 block mb-1">Description</label>
                <textarea
                  rows="2"
                  placeholder="Overview of the development..."
                  value={formData.description}
                  onChange={(e) => setFormData({ ...formData, description: e.target.value })}
                  className="w-full border border-slate-200 rounded-xl p-2.5 focus:border-blue-500 focus:outline-none"
                ></textarea>
              </div>

              <div className="flex items-center justify-end gap-3 pt-3 border-t border-slate-100">
                <button
                  type="button"
                  onClick={onClose}
                  className="px-4 py-2 text-slate-600 hover:bg-slate-100 rounded-xl font-bold"
                >
                  Cancel
                </button>
                <button
                  type="submit"
                  className="px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-bold shadow-md shadow-blue-500/25"
                >
                  Create Project
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    function BookingModal({ targetUnit, availableUnits, clients, onClose, onSubmit }) {
      const [selectedUnitId, setSelectedUnitId] = useState(targetUnit ? targetUnit.id : (availableUnits[0]?.id || ''));
      const [selectedClientId, setSelectedClientId] = useState(clients[0]?.id || '');
      const [bookingAmount, setBookingAmount] = useState('25000');
      const [bookingDate, setBookingDate] = useState('2026-11-20');

      const selectedUnit = availableUnits.find(u => u.id === parseInt(selectedUnitId)) || targetUnit;
      const selectedClient = clients.find(c => c.id === parseInt(selectedClientId));

      const handleConfirm = (e) => {
        e.preventDefault();
        if (!selectedUnit || !selectedClient) return;
        onSubmit({
          unitId: selectedUnit.id,
          unitNo: selectedUnit.unitNo,
          clientId: selectedClient.id,
          clientName: selectedClient.name,
          amount: bookingAmount,
          date: bookingDate
        });
      };

      return (
        <div className="fixed inset-0 bg-slate-950/60 backdrop-blur-xs flex items-center justify-center p-4 z-50 animate-fadeIn">
          <div className="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl border border-slate-200 space-y-4">
            <div className="flex items-center justify-between pb-3 border-b border-slate-100">
              <h3 className="font-extrabold text-lg text-slate-900">Book Property Unit</h3>
              <button onClick={onClose} className="text-slate-400 hover:text-slate-600 font-bold text-lg">×</button>
            </div>

            <form onSubmit={handleConfirm} className="space-y-4 text-xs">
              <div>
                <label className="font-bold text-slate-700 block mb-1">Select Unit (Available Only)</label>
                <select
                  value={selectedUnitId}
                  onChange={(e) => setSelectedUnitId(e.target.value)}
                  className="w-full border border-slate-200 rounded-xl p-2.5 font-semibold focus:border-blue-500 focus:outline-none"
                >
                  {targetUnit && <option value={targetUnit.id}>{targetUnit.unitNo} ({targetUnit.projectName}) - ${targetUnit.price.toLocaleString()}</option>}
                  {availableUnits.filter(u => !targetUnit || u.id !== targetUnit.id).map(u => (
                    <option key={u.id} value={u.id}>
                      {u.unitNo} - {u.projectName} ({u.bhk || u.type}) - ${u.price.toLocaleString()}
                    </option>
                  ))}
                </select>
              </div>

              <div>
                <label className="font-bold text-slate-700 block mb-1">Assign Client / Lead</label>
                <select
                  value={selectedClientId}
                  onChange={(e) => setSelectedClientId(e.target.value)}
                  className="w-full border border-slate-200 rounded-xl p-2.5 font-semibold focus:border-blue-500 focus:outline-none"
                >
                  {clients.map(c => (
                    <option key={c.id} value={c.id}>{c.name} ({c.phone}) - {c.status}</option>
                  ))}
                </select>
              </div>

              <div className="grid grid-cols-2 gap-4">
                <div>
                  <label className="font-bold text-slate-700 block mb-1">Token Booking Amount ($)</label>
                  <input
                    type="number"
                    value={bookingAmount}
                    onChange={(e) => setBookingAmount(e.target.value)}
                    className="w-full border border-slate-200 rounded-xl p-2.5 focus:border-blue-500 focus:outline-none"
                  />
                </div>
                <div>
                  <label className="font-bold text-slate-700 block mb-1">Booking Date</label>
                  <input
                    type="date"
                    value={bookingDate}
                    onChange={(e) => setBookingDate(e.target.value)}
                    className="w-full border border-slate-200 rounded-xl p-2.5 focus:border-blue-500 focus:outline-none"
                  />
                </div>
              </div>

              <div className="p-3 bg-blue-50 rounded-xl text-[11px] text-blue-700 font-medium">
                Note: Conforming this booking will automatically set the Unit status to <strong>Booked</strong> and update the Lead status to <strong>Converted</strong>.
              </div>

              <div className="flex items-center justify-end gap-3 pt-3 border-t border-slate-100">
                <button
                  type="button"
                  onClick={onClose}
                  className="px-4 py-2 text-slate-600 hover:bg-slate-100 rounded-xl font-bold"
                >
                  Cancel
                </button>
                <button
                  type="submit"
                  className="px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-bold shadow-md shadow-blue-500/25"
                >
                  Confirm Booking
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    function SiteProgressModal({ project, onClose }) {
      return (
        <div className="fixed inset-0 bg-slate-950/70 backdrop-blur-xs flex items-center justify-center p-4 z-50 animate-fadeIn">
          <div className="bg-white rounded-3xl max-w-2xl w-full p-6 shadow-2xl border border-slate-200 space-y-4">

              <button onClick={onClose} className="text-slate-400 hover:text-slate-600 font-bold text-lg">×</button>

            <div className="rounded-2xl overflow-hidden h-72 bg-slate-900 relative">
              <img src={project.siteImage} alt="Site" className="w-full h-full object-cover" />
              <div className="absolute bottom-3 left-3 bg-black/60 backdrop-blur-md text-white text-xs px-3 py-1.5 rounded-lg border border-white/20">
                Tower A - 5th Floor Slab Rebar & Shuttering
              </div>
            </div>

            <div className="space-y-2 text-xs">
              <h4 className="font-extrabold text-slate-900">Engineer's Field Notes</h4>
              <p className="text-slate-600 leading-relaxed bg-slate-50 p-3 rounded-xl border border-slate-100">
                Concrete casting completed for Level 4 columns on Nov 20, 2026. Cube test results show 38.5 N/mm² at 14 days, exceeding design specifications. Structural crane maintenance verified. Ready for Level 5 framework.
              </p>
            </div>

            <div className="flex justify-end pt-2">
              <button
                onClick={onClose}
                className="px-5 py-2 bg-slate-900 text-white rounded-xl font-bold text-xs"
              >
                Close Gallery
              </button>
            </div>
          </div>
        </div>
      );
    }

    // Render the React App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
